spring:
  application:
    name: product-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USERNAME:product}
    password: ${DB_PASSWORD:product}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: product-api
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration-hours: 24
  bootstrap:
    seed-enabled: ${APP_SEED_ENABLED:true}
    demo-users-enabled: ${APP_DEMO_USERS_ENABLED:true}
    users-file: ${APP_USERS_FILE:users.txt}

springdoc:
  swagger-ui:
    path: /swagger-ui
