name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 45.128.205.5 >> ~/.ssh/known_hosts

      - name: Run deployment
        env:
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}
        run: |
          ssh root@45.128.205.5 "export GIGACHAT_API_KEY='${GIGACHAT_API_KEY}'; bash -s" < scripts/deploy_vps.sh

      - name: Notify Telegram
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets are not configured, skipping notification."
            exit 0
          fi

          MESSAGE=$(cat <<EOF
          ✅ Деплой успешно завершен

          Репозиторий: ${REPOSITORY}
          Автор: ${ACTOR}
          Коммит: ${SHA}
          Запуск: ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}
          EOF
          )
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
